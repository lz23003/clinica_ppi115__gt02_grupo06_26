<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="actionListener" required="true" method-signature="void action(jakarta.faces.event.ActionEvent)"/>
        <cc:attribute name="formPrincipal" required="true"/>
        <cc:attribute name="procces" default="@this"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:panelGroup>
            <p:commandButton value="#{crud['boton.nuevo']}"
                         actionListener="#{cc.attrs.actionListener}"
                         process="#{cc.attrs.procces}"
                         update=":#{cc.attrs.formPrincipal}"
                         
                         />
        </h:panelGroup>
    </cc:implementation>
</html>
