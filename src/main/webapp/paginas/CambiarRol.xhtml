<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/plantillas/PlantillaPrincipal.xhtml">

    <ui:define name="titulo">
        #{crud['menu.cambiarRol']}
    </ui:define>

    <ui:define name="contenido">
        <div class="ui-fluid" style="max-width: 600px; margin: 40px auto;">
            
            <h:form id="frmCambioRol">
                <p:panelGrid columns="2" columnClasses="ui-grid-col-3, ui-grid-col-9" layout="grid" styleClass="ui-noborder" style="margin-bottom: 20px;">
                    
                    <p:outputLabel for="clinica" value="#{crud['entidad.clinica']}" />
                    <p:autoComplete id="clinica" value="#{cambiarRolModel.clinicaSeleccionada}"
                                    completeMethod="#{cambiarRolModel.completarClinica}"
                                    var="cli" itemLabel="#{cli.nombre}" itemValue="#{cli}"
                                    converter="entityConverter" minQueryLength="3" queryDelay="300"
                                    forceSelection="true">
                        <p:ajax event="itemSelect" update="persona" listener="#{cambiarRolModel.actualizarPersonas}" />
                    </p:autoComplete>

                    <p:outputLabel for="rol" value="#{crud['entidad.rol']}" />
                    <p:autoComplete id="rol" value="#{cambiarRolModel.rolSeleccionado}"
                                    completeMethod="#{cambiarRolModel.completarRol}"
                                    var="r" itemLabel="#{r.nombre}" itemValue="#{r}"
                                    converter="entityConverter" minQueryLength="3" queryDelay="300"
                                    forceSelection="true">
                        <p:ajax event="itemSelect" update="persona" listener="#{cambiarRolModel.actualizarPersonas}" />
                    </p:autoComplete>

                    <p:outputLabel for="persona" value="#{crud['entidad.Persona']}" />
                    <p:autoComplete id="persona" value="#{cambiarRolModel.personaSeleccionada}"
                                    completeMethod="#{cambiarRolModel.completarPersona}"
                                    var="p" itemLabel="#{p.nombres} #{p.apellidos}" itemValue="#{p}"
                                    converter="entityConverter" minQueryLength="3" queryDelay="300"
                                    forceSelection="true"
                                    disabled="#{empty cambiarRolModel.clinicaSeleccionada or empty cambiarRolModel.rolSeleccionado}"/>

                </p:panelGrid>

                <div style="padding-left: 25%;">
                    <p:commandButton value="#{crud['boton.aplicar']}" 
                                     action="#{cambiarRolModel.aplicarCambioRol}" 
                                     ajax="false"
                                     style="width: 120px;" 
                                     styleClass="ui-button-primary"/>
                </div>
            </h:form>
            
        </div>
    </ui:define>

</ui:composition>
